<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-bank1.css">
    <title>Bank App</title>
</head>

<body>
    <div id="app">
        <h1 id="appTitle">Sahajta's Bank</h1>

        <div id="balanceBox">
            <p id="balanceLabel">Available Balance</p>
            <p id="balance">1000</p>
        </div>
    
        <div id="entryBox">
            <label id="amountLabel" for="amount">Enter Amount</label>
            <input type="number" id="amount" placeholder="0">
        </div>

        <div id="buttonBox">
            <button class="actionCredit" id="credit-btn">Credit</button>
            <button class="actionDebit" id="debit-btn">Debit</button>

            <p id="message">Terms and Conditions Apply</p>
            <p id="note"></p>
        </div>
    </div>
</body>

</html>
