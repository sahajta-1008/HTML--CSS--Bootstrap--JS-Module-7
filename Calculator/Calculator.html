<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Calculator</title>

</head>

<body>
    <h1>Calculator</h1>
    <input type="number" id="num1" placeholder="Enter Number 1">
    <input type="number" id="num2" placeholder="Enter Number 2">
    <br><br>
    <button class="btn btn-danger" onclick="add()">Add</button>
    <button class="btn btn-warning" onclick="sub()">Subtract</button>
    <button class="btn btn-success" onclick="mul()">Multiply</button>
    <button class="btn btn-primary" onclick="div()">Divide</button>
    <button class="btn btn-dark" onclick="sq()">Square</button>
    <button class="btn btn-outline-dark" onclick="sqrt()">Square Root</button>
    <button class="btn btn-info" onclick="cube()">Cube</button>
    <button class="btn btn-outline-info" onclick="cubeRoot()">Cube Root</button>
    <br><br>
    <p id="result"></p>

    <script>

        function add() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let result = num1 + num2
            document.getElementById("result").innerHTML = result
        }

        function sub() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let result = num1 - num2
            document.getElementById("result").innerHTML = result
        }

        function mul() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let result = num1 * num2
            document.getElementById("result").innerHTML = result
        }

        function div() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let result;

            if (num2 == 0) {
                result = "Number 2 cannot be 0"
            }
            else {
                result = num1 / num2
            }
            document.getElementById("result").innerHTML = result
        }

        function sq() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let s1 = num1 * num1
            let s2 = num2 * num2
            document.getElementById("result").innerHTML = "The Square of number 1 is " + s1 + " and of number 2 is " + s2
        }

        function sqrt() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let s1 = Math.sqrt(num1)
            let s2 = Math.sqrt(num2)
            document.getElementById("result").innerHTML = "The Square Root of number 1 is " + s1 + " and of number 2 is " + s2
        }

        function cube() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let s1 = num1 * num1 * num1
            let s2 = num2 * num2 * num2
            document.getElementById("result").innerHTML = "The Cube of number 1 is " + s1 + " and of number 2 is " + s2
        }

        function cubeRoot() {
            let num1 = parseInt(document.getElementById("num1").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let s1 = Math.pow(num1, 1 / 3)
            let s2 = Math.pow(num2, 1 / 3)
            document.getElementById("result").innerHTML = "The Cube Root of number 1 is " + s1 + " and of number 2 is " + s2
        }

    </script>
</body>

</html>
